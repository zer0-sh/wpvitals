name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  quality:
    name: PHPCS + PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: [ '7.4', '8.5' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-lock

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}

      - name: Install dependencies
        run: composer install --no-progress --no-interaction

      - name: Run PHPCS
        run: composer run lint

      - name: Run PHPUnit
        run: composer run test
      
      - name: Generate Summary
        if: always()
        run: |
          {
            echo "# CI Quality Report"
            echo ""
            echo "## ${{ job.status == 'success' && 'Pipeline passed' || '❌ Pipeline failed' }}"
            echo ""
            echo "| Check | Status |"
            echo "|---|---|"
            echo "| Composer validation | ${{ job.status == 'success' && 'Passed' || '❌ Failed' }} |"
            echo "| PHPCS | ${{ job.status == 'success' && 'Passed' || '❌ Failed' }} |"
            echo "| PHPUnit | ${{ job.status == 'success' && 'Passed' || '❌ Failed' }} |"
            echo ""
            echo "### Environment"
            echo ""
            echo "| PHP | OS |"
            echo "|---|---|"
            echo "| `${{ matrix.php }}` | `${{ runner.os }}` |"
            echo ""
            echo "> Automated quality checks for this build."
          } >> "$GITHUB_STEP_SUMMARY"