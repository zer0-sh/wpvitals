name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish plugin ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}
          fetch-depth: 0

      - name: Prepare release tag
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BASE_VERSION="$(sed -n "s/^[[:space:]]*define( 'WPVITALS_VERSION', '\([^']*\)'.*/\1/p" wpvitals.php | head -n 1)"
            if [[ ! "${BASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid current plugin version: ${BASE_VERSION}"
              exit 1
            fi

            IFS='.' read -r MAJOR MINOR PATCH <<< "${BASE_VERSION}"
            VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            RELEASE_TAG="v${VERSION}"

            if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              echo "::error::Tag ${RELEASE_TAG} already exists"
              exit 1
            fi

            sed -i -E "s/^( \* Version:[[:space:]]+)[0-9.]+/\1${VERSION}/" wpvitals.php
            sed -i -E "s/(define\( 'WPVITALS_VERSION', ')[0-9.]+(' \);)/\1${VERSION}\2/" wpvitals.php
            sed -i -E "s/^(Stable tag: )[0-9.]+/\1${VERSION}/" readme.txt

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add wpvitals.php readme.txt
            git commit -m "chore: prepare release ${VERSION}"
            git push origin HEAD:main

            git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}"
            git push origin "${RELEASE_TAG}"
          else
            RELEASE_TAG="${GITHUB_REF_NAME}"
            VERSION="${RELEASE_TAG#v}"
          fi

          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use the vX.Y.Z format: ${RELEASE_TAG}"
            exit 1
          fi

          echo "RELEASE_TAG=${RELEASE_TAG}" >> "${GITHUB_ENV}"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "Publishing ${RELEASE_TAG} (version ${VERSION})"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Validate version consistency
        run: |
          set -euo pipefail

          FILE_VERSION="$(sed -n "s/^[[:space:]]*define( 'WPVITALS_VERSION', '\([^']*\)'.*/\1/p" wpvitals.php | head -n 1)"
          README_VERSION="$(sed -n 's/^Stable tag: *//p' readme.txt | head -n 1)"

          echo "Plugin version: ${FILE_VERSION}"
          echo "Readme version: ${README_VERSION}"
          echo "Tag version:    ${VERSION}"

          if [[ -z "${FILE_VERSION}" || "${FILE_VERSION}" != "${VERSION}" ]]; then
            echo "::error::wpvitals.php version does not match ${RELEASE_TAG}"
            exit 1
          fi

          if [[ "${README_VERSION}" != "${VERSION}" ]]; then
            echo "::error::readme.txt Stable tag does not match ${RELEASE_TAG}"
            exit 1
          fi

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader --classmap-authoritative

      - name: Stage plugin files
        run: |
          set -euo pipefail

          rm -rf staging
          mkdir -p staging/wpvitals
          rsync -a --no-owner --no-group \
            wpvitals.php \
            readme.txt \
            LICENSE \
            staging/wpvitals/
          rsync -a --no-owner --no-group \
            includes \
            admin \
            assets \
            languages \
            vendor \
            staging/wpvitals/

          test -f staging/wpvitals/wpvitals.php
          test -f staging/wpvitals/vendor/autoload.php
          test -f staging/wpvitals/readme.txt
          test -f staging/wpvitals/LICENSE

      - name: Build and verify ZIP
        env:
          ZIP_PATH: wpvitals-${{ env.VERSION }}.zip
        run: |
          set -euo pipefail

          (cd staging && zip -qr "../${ZIP_PATH}" wpvitals)
          unzip -t "${ZIP_PATH}"

          if ! unzip -Z1 "${ZIP_PATH}" | grep -q '^wpvitals/wpvitals.php$'; then
            echo "::error::The ZIP does not contain wpvitals/wpvitals.php"
            exit 1
          fi

          echo "Built ${ZIP_PATH} ($(du -h "${ZIP_PATH}" | cut -f1))"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: wpvitals-${{ env.VERSION }}-zip
          path: wpvitals-${{ env.VERSION }}.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${RELEASE_TAG}" "wpvitals-${VERSION}.zip" --verify-tag --generate-notes --title "WPVitals ${VERSION}"
